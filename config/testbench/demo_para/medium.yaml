# empty01 地图上的中等离散搜索参数。
map_path: map/empty01.json

vehicle:
  length: 4.5
  width: 2.0
  wheelbase: 2.7
  rear_to_center: 1.35
  max_steer: 0.61

hybrid_astar:
  xy_resolution: 0.5
  theta_bins: 72
  step_size: 0.5
  primitive_length: 0.5
  goal_xy_tolerance: 1
  goal_theta_tolerance: 0.1
  reverse_penalty: 5.0
  steer_penalty: 1
  gear_switch_penalty: 1.0
  steer_change_penalty: 4.0
  max_iterations: 300000
  allow_reverse: true
  enable_analytic_expansion: true
  analytic_expansion_distance: 8
  analytic_expansion_interval: 1
  collision_safety_margin: 0.0
  enable_obstacle_heuristic: true
  obstacle_lookup_resolution: 1
  obstacle_heuristic_type: visibility_graph
  obstacle_heuristic_inflation_alpha: 1.0
  enable_timing: true
  debug: true
  debug_progress_interval: 5000
