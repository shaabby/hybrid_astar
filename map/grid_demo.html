<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Map Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #17202a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(1100px, calc(100vw - 32px));
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .legend {
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: 14px;
      color: #4b5563;
    }

    .legend span {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #ffffff;
      border: 1px solid #cfd6df;
    }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <h1>Hybrid A* Grid Map Demo</h1>
      <div class="legend">
        <span><i class="swatch" style="background:#111827"></i>障碍物</span>
        <span><i class="swatch" style="background:#16a34a"></i>起点</span>
        <span><i class="swatch" style="background:#dc2626"></i>终点</span>
      </div>
    </div>
    <canvas id="map" width="1000" height="640"></canvas>
  </main>

  <script>
    const mapData = {
      width: 60,
      height: 36,
      start: { x: 6, y: 6, theta: 0 },
      goal: { x: 52, y: 28, theta: 0 },
      obstacles: [
        { x: 0, y: 0, w: 60, h: 1 },
        { x: 0, y: 35, w: 60, h: 1 },
        { x: 0, y: 0, w: 1, h: 36 },
        { x: 59, y: 0, w: 1, h: 36 },
        { x: 12, y: 12, w: 32, h: 3 },
        { x: 20, y: 21, w: 28, h: 3 },
        { x: 34, y: 4, w: 3, h: 13 },
        { x: 48, y: 24, w: 2, h: 8 },
        { x: 56, y: 24, w: 2, h: 8 }
      ]
    };

    const canvas = document.getElementById("map");
    const ctx = canvas.getContext("2d");

    const margin = 36;
    const cell = Math.min(
      (canvas.width - margin * 2) / mapData.width,
      (canvas.height - margin * 2) / mapData.height
    );
    const originX = margin;
    const originY = canvas.height - margin;

    function toCanvasX(x) {
      return originX + x * cell;
    }

    function toCanvasY(y) {
      return originY - y * cell;
    }

    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = "#e5e7eb";
      ctx.lineWidth = 1;

      for (let x = 0; x <= mapData.width; ++x) {
        const px = toCanvasX(x);
        ctx.beginPath();
        ctx.moveTo(px, toCanvasY(0));
        ctx.lineTo(px, toCanvasY(mapData.height));
        ctx.stroke();
      }

      for (let y = 0; y <= mapData.height; ++y) {
        const py = toCanvasY(y);
        ctx.beginPath();
        ctx.moveTo(toCanvasX(0), py);
        ctx.lineTo(toCanvasX(mapData.width), py);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawObstacles() {
      ctx.save();
      ctx.fillStyle = "#111827";
      for (const obs of mapData.obstacles) {
        ctx.fillRect(
          toCanvasX(obs.x),
          toCanvasY(obs.y + obs.h),
          obs.w * cell,
          obs.h * cell
        );
      }
      ctx.restore();
    }

    function drawPose(pose, color, label) {
      const x = toCanvasX(pose.x);
      const y = toCanvasY(pose.y);
      const r = cell * 0.42;

      ctx.save();
      ctx.fillStyle = color;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(pose.theta) * cell * 1.2, y - Math.sin(pose.theta) * cell * 1.2);
      ctx.stroke();

      ctx.fillStyle = "#111827";
      ctx.font = "600 14px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y - cell * 0.8);
      ctx.restore();
    }

    function drawBorder() {
      ctx.save();
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 2;
      ctx.strokeRect(
        toCanvasX(0),
        toCanvasY(mapData.height),
        mapData.width * cell,
        mapData.height * cell
      );
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawObstacles();
      drawBorder();
      drawPose(mapData.start, "#16a34a", "S");
      drawPose(mapData.goal, "#dc2626", "G");
    }

    draw();
  </script>
</body>
</html>
